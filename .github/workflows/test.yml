name: Tests
on:
  push: null
env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -Dwarnings
jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install cargo-hack
      uses: taiki-e/install-action@cargo-hack
    - uses: Swatinem/rust-cache@v2
    - name: Use predefined lockfile
      run: mv -v Cargo.lock.MSRV Cargo.lock
    - name: Build (lib only)
      run: cargo hack check --rust-version --locked
  test:
    needs:
    - clippy
    - msrv
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
    - name: Test default features
      run: cargo test
  clippy:
    runs-on: ubuntu-latest
    steps:
    - name: stepify-probe-clippy
      run: echo stepify-probe-clippy
    - name: stepify-fault-clippy
      run: exit 1
    - uses: actions/checkout@v4
    - name: Install Rust stable with clippy
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Run cargo clippy (default features)
      run: cargo clippy --all-targets
    - name: stepify-tail-clippy
      run: echo stepify-tail-clippy
    - name: stepify-probe-fmt
      run: echo stepify-probe-fmt
    - name: Install Rust stable with rustfmt
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Run rustfmt --check
      run: cargo fmt -- --check
    - name: stepify-tail-fmt
      run: echo stepify-tail-fmt
    - name: stepify-probe-features
      run: echo stepify-probe-features
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-hack
      uses: taiki-e/install-action@cargo-hack
    - uses: Swatinem/rust-cache@v2
    - name: Check all possible feature sets
      run: cargo hack check --feature-powerset --no-dev-deps
    - name: stepify-tail-features
      run: echo stepify-tail-features
